<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>救救阿公的攤位</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <div id="canvas-slot">
      <section id="screen" aria-live="polite" hidden>
        <div id="screen-card">
          <h1 id="screen-title"></h1>
          <p id="screen-story"></p>
          <div id="billing"></div>
          <div id="stall-panel">
            <div id="stall-head">
              <span id="stall-title"></span>
              <span>攤位 Lv.<b id="stall-level">1</b>　大獎出珠 <b id="stall-scale">×1.0</b></span>
            </div>
            <button id="upgrade" type="button"></button>
            <p id="next-rent"></p>
            <p id="boss-note" hidden></p>
          </div>
          <button id="open-night" type="button"></button>
          <button id="restart" type="button"></button>
        </div>
      </section>
    </div>
    <section id="controls" aria-label="遊戲操作">
      <div id="stats" aria-live="polite">
        <span>第 <b id="stat-night">1</b> 晚</span>
        <span>收攤可得 <b id="stat-value">0</b></span>
        <span>現金 <b id="stat-cash">0</b></span>
        <span>珠子 <b id="stat-balls">0</b></span>
        <span>地頭費 <b id="stat-rent">0</b></span>
        <span>Lv.<b id="stat-level">1</b></span>
      </div>
      <div id="actions">
        <button id="fire" type="button"><span id="fire-label">發射！</span><small id="fire-hint">按住連發・空白鍵</small></button>
        <div id="options">
          <label for="power">力道 <b id="power-value">55</b></label>
          <input id="power" type="range" min="0" max="100" value="55">
          <label for="force">演出測試</label>
          <select id="force">
            <option value="">關閉（正常打珠）</option>
            <option value="miss">直接沒中</option>
            <option value="reachMiss">藍色聽牌，沒中</option>
            <option value="goldMiss">金色聽牌，沒中</option>
            <option value="reachHit">紅色聽牌，中獎，RUSH 沒連莊</option>
            <option value="comeback">沒中後復活</option>
            <option value="superHit">三聖筊必中，RUSH 連莊 2 次</option>
            <option value="rushFinal">RUSH 一路走到廟口</option>
          </select>
          <div id="night-buttons">
            <button id="buy" type="button">買100珠<small id="buy-cost">−400 元</small></button>
            <button id="close-stall" type="button">收攤</button>
            <button id="mute" type="button" aria-pressed="false">聲音：開</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
