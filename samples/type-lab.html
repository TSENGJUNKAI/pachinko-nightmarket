<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字體範例</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@900&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px; background: #0b0714; color: #fff4dc; font-family: "Microsoft JhengHei", sans-serif; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 1000px; margin: auto; }
  svg { width: 100%; display: block; border-radius: 12px; }
  h2 { font-size: 18px; margin: 8px 0 0; text-align: center; }
</style>
</head>
<body>
<main>
<section>
<svg viewBox="0 0 220 340" role="img" aria-label="A 烈焰毛筆">
<defs><linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7b0"/><stop offset=".45" stop-color="#ffc21a"/><stop offset=".75" stop-color="#ff3d0d"/><stop offset="1" stop-color="#8d0505"/></linearGradient>
<radialGradient id="fb"><stop offset="0" stop-color="#ffe45c"/><stop offset=".45" stop-color="#f4400f"/><stop offset="1" stop-color="#3c0303"/></radialGradient></defs>
<rect width="220" height="340" fill="url(#fb)"/>
<g stroke="#fff3a0" stroke-opacity=".45" stroke-width="5"><path d="M110 170L0 20M110 170L60 0M110 170L170 0M110 170L220 40M110 170L220 150M110 170L220 300M110 170L150 340M110 170L40 340M110 170L0 260M110 170L0 130"/></g>
<g font-family="'Yuji Boku','Noto Serif TC',serif" font-size="118" text-anchor="middle" font-weight="900" paint-order="stroke" stroke-linejoin="round">
<text x="110" y="135" fill="#000" stroke="#000" stroke-width="26">激</text><text x="110" y="135" fill="url(#fa)" stroke="#fff" stroke-width="7">激</text>
<text x="110" y="262" fill="#000" stroke="#000" stroke-width="26">熱</text><text x="110" y="262" fill="url(#fa)" stroke="#fff" stroke-width="7">熱</text></g>
<text x="110" y="326" font-family="'Noto Sans TC',sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#ffe45c" stroke="#5c0000" stroke-width="7" paint-order="stroke">大獎確定</text>
</svg>
<h2>A 烈焰毛筆</h2>
</section>
<section>
<svg viewBox="0 0 220 340" role="img" aria-label="B 金箔廟匾">
<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset=".3" stop-color="#ffd24a"/><stop offset=".5" stop-color="#8f5a00"/><stop offset=".56" stop-color="#ffe98c"/><stop offset="1" stop-color="#b86e00"/></linearGradient></defs>
<rect width="220" height="340" fill="#7a0c12"/><rect x="10" y="10" width="200" height="320" rx="10" fill="#a81218" stroke="#ffd24a" stroke-width="7"/><rect x="21" y="21" width="178" height="298" rx="4" fill="none" stroke="#ffd24a" stroke-width="2"/>
<g font-family="'Noto Serif TC',serif" font-size="112" text-anchor="middle" font-weight="900" paint-order="stroke" stroke-linejoin="round">
<text x="110" y="133" fill="#2c0504" stroke="#2c0504" stroke-width="20">激</text><text x="110" y="133" fill="url(#ga)" stroke="#fff0b0" stroke-width="3">激</text>
<text x="110" y="252" fill="#2c0504" stroke="#2c0504" stroke-width="20">熱</text><text x="110" y="252" fill="url(#ga)" stroke="#fff0b0" stroke-width="3">熱</text></g>
<text x="110" y="310" font-family="'Noto Serif TC',serif" font-size="34" font-weight="900" text-anchor="middle" fill="url(#ga)" stroke="#2c0504" stroke-width="7" paint-order="stroke">大獎確定</text>
</svg>
<h2>B 金箔廟匾</h2>
</section>
<section>
<svg viewBox="0 0 220 340" role="img" aria-label="C 廟會霓虹">
<defs><filter id="na" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs>
<rect width="220" height="340" fill="#18062f"/>
<g fill="#ffd257"><circle cx="20" cy="20" r="6"/><circle cx="65" cy="20" r="6"/><circle cx="110" cy="20" r="6"/><circle cx="155" cy="20" r="6"/><circle cx="200" cy="20" r="6"/><circle cx="20" cy="320" r="6"/><circle cx="65" cy="320" r="6"/><circle cx="110" cy="320" r="6"/><circle cx="155" cy="320" r="6"/><circle cx="200" cy="320" r="6"/></g>
<g font-family="'Noto Sans TC',sans-serif" font-size="112" text-anchor="middle" font-weight="900">
<g filter="url(#na)" fill="none" stroke="#ff2fa0" stroke-width="10"><text x="110" y="138">激</text></g><g filter="url(#na)" fill="none" stroke="#21f0ff" stroke-width="10"><text x="110" y="256">熱</text></g>
<text x="110" y="138" fill="#fff" stroke="#ff2fa0" stroke-width="6" paint-order="stroke">激</text><text x="110" y="256" fill="#fff" stroke="#21f0ff" stroke-width="6" paint-order="stroke">熱</text></g>
<text x="110" y="302" font-family="'Noto Sans TC',sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#fff36b" stroke="#ff2fa0" stroke-width="5" paint-order="stroke">大獎確定</text>
</svg>
<h2>C 廟會霓虹</h2>
</section>
</main>
</body>
</html>
